
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Things Count</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: sans-serif; text-align: center; background: #f0f0f0; }
    video, canvas { width: 90%; max-width: 600px; margin: 10px auto; display: block; }
    #count, #results { font-size: 18px; margin: 10px auto; }
    #results { background: #fff; padding: 10px; border: 1px solid #ccc; max-width: 600px; }
    button { margin: 5px; padding: 8px 12px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Things Count</h1>
  <button id="toggleCamera">Toggle Camera</button>
  <button id="toggleFlash">Toggle Flash</button>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="count">Detecting...</div>
  <div id="results">Results will appear here.</div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <script src="thingscount.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
